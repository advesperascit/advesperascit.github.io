baseURL: https://advesperascit.github.io/

locale: ru-RU

title: advesperascit

#copyright: © 2020-2024 Leo X

pagination:
  pagerSize: 10
  # Specify the number of posts listed at home page

theme: hugo-theme-minima-advesperascit
# Specify a theme to use

defaultContentLanguage: ru
# Specify the default language

params:
  # Define regular configurations

  greet: advesperascit

  subtitle:

  defaultTheme: dark

  displayDate: true
  displayDescription: true

  selectable: true

  author:
    name: advesperascit
    status: Драсьте. они/их.
    avatar: https://avatars.githubusercontent.com/u/308530493
    description: |
      Перевожу ручками разные тексты.
      Не содержит нейроблёва.

  social:
    - name: "github"
      url: "https://github.com/advesperascit/site"
    - name: "rss"
      url: "index.xml"

  math:
    enable: true
    provider: katex

  diagram:
    enable: false
    provider: mermaid

  comment:
    enable: false

  search:
    enable: false
    provider: fuse
    title: Search
    placeholder: Enter keywords

    fuse:
      # See also https://fusejs.io
      keys:
        - title
        - permalink
        - summary
        - content
      distance: 100
      location: 0
      threshold: 0.6
      ignoreLocation: false
      isCaseSensitive: false
      includeScore: false
      includeMatches: false
      minMatchCharLength: 1
      shouldSort: true
      findAllMatches: false

menu:
  main:
    - identifier: home
      name: Home
      weight: 1
    - identifier: tags
      name: Tags
      weight: 2
    - identifier: series
      name: Series
      weight: 3
    - identifier: search
      name: 🔍
      weight: 4

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    #- JSON

markup:
  # **DO NOT EDIT** anything below. 
  # Because unlike other Hugo themes, the way Minima uses to do syntax
  # highlighting depends strongly on configurations below, so that the
  # color theme of code blocks changes with the blog color theme, instead
  # of being static like you may have seen on other Hugo themes.
  highlight:
    lineNos: true
    noClasses: false
